---
schema_version: 1
application:
  name: datavis-api
deployment:
  interface: service_creator_v1
  install: backend/deploy/install.sh
  readiness: backend/deploy/readiness.sh
  health_path: /health/ready
  default_root: /opt/datavis-api

  build: backend/deploy/build.sh
  artifact_root: backend/.deploy-artifact

  defaults_file: backend/deploy/defaults.env
  environment_file: /etc/datavis-api/service.env

  generated_secret_env:
    datavis_api_api_token: DATAVIS_API_API_TOKEN

  allocation_env:
    bind_host: DATAVIS_API_HOST
    app_port: DATAVIS_API_PORT
    specify_collection_id: SPECIFY_COLLECTION_ID

  secrets_required: true
