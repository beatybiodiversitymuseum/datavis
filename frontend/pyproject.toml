[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datavis"
version = "0.1.0"
description = "Public multipage Streamlit host for curated Specify visualizations"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "requests>=2.32,<3",
    "streamlit>=1.49,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
datavis = "datavis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
